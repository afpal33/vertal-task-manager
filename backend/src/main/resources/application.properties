spring.application.name=vertal
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vertal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vertal}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:vertal}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=5
vertal.jwt.secret=${JWT_SECRET:change-this-development-secret-with-at-least-32-chars}
vertal.jwt.expiration-ms=${JWT_EXPIRATION:3600000}
vertal.server.public-key=${SERVER_PUBLIC_KEY:development-server-public-key}
